apply plugin: 'com.android.application'
apply plugin: 'com.google.protobuf'

android {
    compileSdk 36

    //Chih-Yuan Yang: I need the compileSdkVersion item for Android 6 SDK. Don't remove it. Don't
    //follow new gradle version's suggestion.

    defaultConfig {
        applicationId 'tw.edu.cgu.ai.zenbojuniorii'
        minSdk 29
        targetSdk 29
        versionCode 10
        versionName 'v10 25.07.24'
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            //Proguard will reduce unused library code when packaging into an APK file.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
    namespace 'tw.edu.cgu.ai.zenbo'

    buildFeatures {
        buildConfig = true
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    sourceSets{
        main{
            java {
                srcDir 'src/main/java'
            }
            proto {
                srcDir 'src/main/proto'
            }
        }
    }

    protobuf {
        protoc {
            artifact = 'com.google.protobuf:protoc:3.19.1'
        }
//        //配置生成目录，编译后会在 build 的目录下生成对应的java文件
        generateProtoTasks {
            all().each { task ->
                task.builtins {
                    java{
                        option "lite"
                    }
                }
            }
        }
    }
    androidResources {
        noCompress 'pb'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.android.support.constraint:constraint-layout:2.0.4'
    //junit is a library which can automatically generate test code to test your logic code
    //It is only used for testing and is not included in the APK file.
    //It is a standard to include the junit library.
    testImplementation 'junit:junit:4.13.2'
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation project(':ZenboSDK')
    //protobuf-javalite is a protobuf library for java devices. Lite means that it is
    //efficient and fast, because Android device's memory is limited.
    //It turns .proto code into java code.
    //Because my server-side protobuf version is 3.19.1, I should use the same version for robot apps.
    implementation 'com.google.protobuf:protobuf-javalite:3.19.1'
}

