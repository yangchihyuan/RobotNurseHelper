syntax = "proto2";

package RobotCommandProtobuf;

option java_package = "tw.edu.cgu.ai";
option java_outer_classname = "RobotCommandOuterClass";

import "google/protobuf/timestamp.proto";

//Zenbo has degree, but does not have turn_speed.
message RobotCommand {
  optional uint64 time_stamp = 1;
  optional int32 pitch_degree = 2;
  optional string speak_sentence = 3;
  optional int32 x = 4;
  optional int32 y = 5;
  optional int32 degree = 6;
  optional int32 bodyspeed = 7;
  optional int32 yaw = 8;
  optional int32 pitch = 9;
  optional int32 headspeed = 10;
  optional int32 face = 11;

  enum FaceEnum{
    ACTIVE = 0;
    AWARE_LEFT = 1;
    AWARE_RIGHT = 2;
    CONFIDENT = 3;
    DEFAULT = 4;
    DEFAULT_STILL = 5;
    DOUBTING = 6;
    EXPECTING = 7;
    HAPPY = 8;
    HELPLESS = 9;
    HIDEFACE = 10;
    IMPATIENT = 11;
    INNOCENT = 12;
    INTERESTED = 13;
    LAZY = 14;
    PLEASED = 15;
    PRETENDING = 16;
    PROUD = 17;
    QUESTIONING = 18;
    SERIOUS = 19;
    SHOCKED = 20;
    SHY = 21;
    SINGING = 22;
    TIRED = 23;
    WORRIED = 24;
    }

  optional int32 speed = 12;
  optional int32 volume = 13;
  optional int32 speak_pitch = 14;

  enum MoveModeEnum{
        Manual = 0;
        LookForPeople = 1;
    }

  optional MoveModeEnum movemode = 15;
  optional int32 stopmove = 16;
  optional int32 predefined_action = 17;
  optional int32 hideface = 18;
  optional int32 song = 19;
  optional int32 stopsong = 20;
  optional bool killapp = 21;
  optional string sface = 22;
  //Barge-in support: interrupt whatever the robot is currently saying immediately.
  optional bool stop_speaking = 24;
  /*
  ACTIVE
  AWARE_LEFT
  AWARE_RIGHT
  CONFIDENT
  DEFAULT
  DEFAULT_STILL
  DOUBTING
  EXPECTING
  HAPPY
  HELPLESS
  HIDEFACE
  IMPATIENT
  INNOCENT
  INTERESTED
  LAZY
  PLEASED
  PRETENDING
  PROUD
  QUESTIONING
  SERIOUS
  SHOCKED
  SHY
  SINGING
  TIRED
  WORRIED
  */

  optional string smotion = 23;
  /*
  Body_twist_1
  Body_twist_2
  Dance_2_loop
  Dance_3_loop
  Dance_b_1_loop
  Dance_s_1_loop
  Default_1
  Default_2
  Find_face
  Head_down_1
  Head_down_2
  Head_down_3
  Head_down_4
  Head_down_5
  Head_down_7
  Head_twist_1_loop
  Head_up_1
  Head_up_2
  Head_up_3
  Head_up_4
  Head_up_5
  Head_up_6
  Head_up_7
  Music_1_loop
  Nod_1
  Shake_head_1
  Shake_head_2
  Shake_head_3
  Shake_head_4_loop
  Shake_head_5
  Shake_head_6
  Turn_left_1
  Turn_left_2
  Turn_left_reverse_1
  Turn_left_reverse_2
  Turn_right_1
  Turn_right_2
  Turn_right_reverse_1
  Turn_right_reverse_2
  */

}

//The message that the robot sends to the server
message RobotToServerMessage {
  optional google.protobuf.Timestamp event_time = 1;
  optional int32 jpegdatalength = 2;
  optional bytes jpegdata = 3;
  optional string description = 4;
  optional int32 numberpressed = 5;
  optional float yaw = 6;           //why I cannot use float in my message?
  optional float pitch = 7;
  optional string tabletcommand = 8;
}

