apply plugin: 'com.android.application'
apply plugin: 'com.google.protobuf'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    compileSdk = 37  //AGP 9 need the "=" assignment symbol because compileSdk becomes a property
    defaultConfig {
        applicationId = 'tw.edu.cgu.ai'
        versionCode = 260819
        versionName = 'v2026.08.19'
        externalNativeBuild {
            cmake {
                cppFlags ""
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    flavorDimensions += ['RobotType']

    productFlavors {
        Kebbi {
            dimension = 'RobotType'
            minSdk = 28
            targetSdk = 28
            applicationIdSuffix = ".kebbi"
            versionNameSuffix = "-kebbi"
        }
        Zenbo{
            dimension = 'RobotType'
            minSdk = 23
            targetSdk = 23
            applicationIdSuffix = ".zenbo"
            versionNameSuffix = "-zenbo"
        }
        ZenboJrII{
            dimension = 'RobotType'
            minSdk = 29
            targetSdk = 29
            applicationIdSuffix = ".zenbojrii"
            versionNameSuffix = "-zenbojrii"
        }
    }


    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    namespace = 'tw.edu.cgu.ai'

    sourceSets{
        main{
            java {
                srcDir 'src/main/java'
            }
            proto {
                srcDir 'src/main/proto'
            }
        }
        Kebbi {
            proto {
                srcDir 'src/Kebbi/proto'
            }
        }
        Zenbo {
            proto {
                srcDir 'src/Zenbo/proto'
            }
        }
        ZenboJrII {
            proto {
                srcDir 'src/ZenboJrII/proto'
            }
        }
    }

    protobuf {
        protoc {
            artifact = 'com.google.protobuf:protoc:3.19.1'
        }
//        //配置生成目录，编译后会在 build 的目录下生成对应的java文件
        generateProtoTasks {
            all().each { task ->
                task.builtins {
                    java{
                        option "lite"
                    }
                }
            }
        }
    }
    androidResources {
        noCompress 'pb'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    testImplementation 'junit:junit:4.12'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    KebbiImplementation (name:'NuwaSDK-2021-07-08_1058_2.1.0.08_e21fe7', ext:'aar')
    ZenboJrIIImplementation (name:'ZenboJuniorSDK', ext:'jar')
    ZenboImplementation (name:'ZenboSDK', ext:'jar')
    implementation 'com.google.protobuf:protobuf-javalite:3.19.1'
    implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.0"))

    //2025/8/24 for camera as a service
    implementation "androidx.camera:camera-camera2:1.5.0"
    implementation "androidx.camera:camera-lifecycle:1.5.0"
    implementation "androidx.camera:camera-view:1.5.0"
    implementation "androidx.lifecycle:lifecycle-service:2.9.4"

    //2025/12/29 debug memory leak
    debugImplementation "com.squareup.leakcanary:leakcanary-android:2.13"
}

repositories {
    flatDir {
        dirs 'libs', 'src/Kebbi/libs', 'src/ZenboJrII/libs', 'src/Zenbo/libs'
    }
}
